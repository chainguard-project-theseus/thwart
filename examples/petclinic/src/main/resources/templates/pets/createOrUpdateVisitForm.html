<!DOCTYPE html>

<html xmlns:t="https://thwart.chainguard.dev" t:replace="~{fragments/layout :: layout (~{::body},'owners')}" t:import="org.springframework.samples.petclinic.owner.*" t:params="Visit visit, Pet pet, Owner owner, LocalDate minVisitDate">

<body t:remove="tag">

  <h2>
    <t:block t:if="visit.isNew()" t:text="#{new}">New </t:block>
    Visit
  </h2>

  <b t:text="#{pet}">Pet</b>
  <table class="table table-striped">
    <thead>
      <tr>
        <th t:text="#{name}">Name</th>
        <th t:text="#{birthDate}">Birth Date</th>
        <th t:text="#{type}">Type</th>
        <th t:text="#{owner}">Owner</th>
      </tr>
    </thead>
    <tr>
      <td t:text="pet.name"></td>
      <td t:text="temporals.format(pet.birthDate, 'yyyy-MM-dd')"></td>
      <td t:text="pet.type?.name"></td>
      <td t:text="owner?.firstName + ' ' + owner?.lastName"></td>
    </tr>
  </table>

  <form t:object="visit" class="form-horizontal" method="post">
    <div class="form-group has-feedback">
      <input t:replace="~{fragments/inputField :: inputWithMin (#{date}, 'date', 'date', minVisitDate)}" />
      <input t:replace="~{fragments/inputField :: input (#{description}, 'description', 'text')}" />
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <input type="hidden" name="petId" t:value="pet.id" />
        <button class="btn btn-primary" type="submit" t:text="#{addVisit}">Add Visit</button>
      </div>
    </div>
  </form>

  <br />
  <b t:text="#{previousVisits}">Previous Visits</b>
  <table class="table table-striped">
    <tr>
      <th t:text="#{date}">Date</th>
      <th t:text="#{description}">Description</th>
    </tr>
    <tr t:if="!visit.isNew()" t:each="visit : pet.visits">
      <td t:text="temporals.format(visit.date, 'yyyy-MM-dd')"></td>
      <td t:text=" visit.description"></td>
    </tr>
  </table>

</body>

</html>
