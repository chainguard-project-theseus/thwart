<!DOCTYPE html>

<html xmlns:t="https://thwart.chainguard.dev" t:replace="~{fragments/layout :: layout (~{::body},'owners')}" t:import="org.springframework.samples.petclinic.owner.*" t:params="Pet pet, Owner owner, Collection<PetType> types">

<body t:remove="tag">

  <h2>
    <t:block t:if="pet.isNew()" t:text="#{new}">New </t:block>
    <span t:text="#{pet}">Pet</span>
  </h2>
  <form t:object="pet" class="form-horizontal" method="post">
    <input type="hidden" name="id" t:value="*{id}" />
    <div class="form-group has-feedback">
      <div class="form-group">
        <label class="col-sm-2 control-label" t:text="#{owner}">Owner</label>
        <div class="col-sm-10">
          <span t:text="owner?.firstName + ' ' + owner?.lastName" />
        </div>
      </div>
      <input t:replace="~{fragments/inputField :: input (#{name}, 'name', 'text')}" />
      <input t:replace="~{fragments/inputField :: input (#{birthDate}, 'birthDate', 'date')}" />
      <input t:replace="~{fragments/selectField :: select (#{type}, 'type', types)}" />
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button t:with="text=pet.isNew() ? 'Add Pet' : 'Update Pet'" class="btn btn-primary" type="submit"
          t:text="text">Add Pet</button>
      </div>
    </div>
  </form>

</body>

</html>
