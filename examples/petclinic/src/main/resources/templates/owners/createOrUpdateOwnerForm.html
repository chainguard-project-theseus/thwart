<!DOCTYPE html>

<html xmlns:t="https://tessera.dev" t:replace="~{fragments/layout :: layout (~{::body},'owners')}" t:import="org.springframework.samples.petclinic.owner.*" t:params="Owner owner">

<body t:remove="tag">

  <h2 t:text="#{owner}">Owner</h2>
  <form t:object="owner" class="form-horizontal" id="add-owner-form" method="post">
    <div class="form-group has-feedback">
      <input t:replace="~{fragments/inputField :: input (#{firstName}, 'firstName', 'text')}" />
      <input t:replace="~{fragments/inputField :: input (#{lastName}, 'lastName', 'text')}" />
      <input t:replace="~{fragments/inputField :: input (#{address}, 'address', 'text')}" />
      <input t:replace="~{fragments/inputField :: input (#{city}, 'city', 'text')}" />
      <input t:replace="~{fragments/inputField :: input (#{telephone}, 'telephone', 'text')}" />
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button t:with="text=owner.isNew() ? #{addOwner} : #{updateOwner}" class="btn btn-primary" type="submit"
          t:text="text">Add Owner</button>
      </div>
    </div>
  </form>
</body>

</html>
