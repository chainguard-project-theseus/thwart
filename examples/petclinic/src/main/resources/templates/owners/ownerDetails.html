<!DOCTYPE html>

<html xmlns:t="https://tessera.dev" t:replace="~{fragments/layout :: layout (~{::body},'owners')}" t:import="org.springframework.samples.petclinic.owner.*" t:params="String message, String error, Owner owner">

<body t:remove="tag">

  <h2 t:text="#{ownerInformation}">Owner Information</h2>

  <div t:if="message" class="alert alert-success" id="success-message">
    <span t:text="message"></span>
  </div>

  <div t:if="error" class="alert alert-danger" id="error-message">
    <span t:text="error"></span>
  </div>

  <table class="table table-striped" t:object="owner">
    <tr>
      <th t:text="#{name}">Name</th>
      <td><b t:text="*{firstName} + ' ' + *{lastName}"></b></td>
    </tr>
    <tr>
      <th t:text="#{address}">Address</th>
      <td t:text="*{address}"></td>
    </tr>
    <tr>
      <th t:text="#{city}">City</th>
      <td t:text="*{city}"></td>
    </tr>
    <tr>
      <th t:text="#{telephone}">Telephone</th>
      <td t:text="*{telephone}"></td>
    </tr>
  </table>

  <a t:href="@{{ownerId}/edit(ownerId=owner.id)}" class="btn btn-primary" t:text="#{editOwner}">Edit
    Owner</a>
  <a t:href="@{{ownerId}/pets/new(ownerId=owner.id)}" class="btn btn-primary" t:text="#{addNewPet}">Add
    New Pet</a>

  <br />
  <br />
  <br />
  <h2 t:text="#{petsAndVisits}">Pets and Visits</h2>

  <table class="table table-striped"><tbody>

    <tr t:each="pet : owner.pets">
      <td valign="top">
        <dl class="dl-horizontal">
          <dt t:text="#{name}">Name</dt>
          <dd t:text="pet.name"></dd>
          <dt t:text="#{birthDate}">Birth Date</dt>
          <dd t:text="temporals.format(pet.birthDate, 'yyyy-MM-dd')"></dd>
          <dt t:text="#{type}">Type</dt>
          <dd t:text="pet.type"></dd>
        </dl>
      </td>
      <td valign="top">
        <table class="table-condensed">
          <thead>
            <tr>
              <th t:text="#{visitDate}">Visit Date</th>
              <th t:text="#{description}">Description</th>
            </tr>
          </thead><tbody>
          <tr t:each="visit : pet.visits">
            <td t:text="temporals.format(visit.date, 'yyyy-MM-dd')"></td>
            <td t:text="visit?.description"></td>
          </tr>
          <tr>
            <td><a t:href="@{{ownerId}/pets/{petId}/edit(ownerId=owner.id, petId=pet.id)}" t:text="#{editPet}">Edit Pet</a></td>
            <td><a t:href="@{{ownerId}/pets/{petId}/visits/new(ownerId=owner.id, petId=pet.id)}" t:text="#{addVisit}">Add Visit</a></td>
          </tr>
        </tbody></table>
      </td>
    </tr>

  </tbody></table>
  <script>
    // Function to hide the success and error messages after 3 seconds
    function hideMessages() {
      setTimeout(function () {
        document.getElementById("success-message").style.display = "none";
        document.getElementById("error-message").style.display = "none";
      }, 3000); // 3000 milliseconds (3 seconds)
    }

    // Call the function to hide messages
    hideMessages();
  </script>

</body>


</html>
