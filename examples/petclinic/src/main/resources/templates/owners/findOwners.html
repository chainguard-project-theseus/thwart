<!DOCTYPE html>

<html xmlns:t="https://tessera.dev" t:replace="~{fragments/layout :: layout (~{::body},'owners')}" t:import="org.springframework.samples.petclinic.owner.*" t:params="Owner owner">

<body t:remove="tag">

  <h2 t:text="#{findOwners}">Find Owners</h2>

  <form t:object="owner" t:action="@{/owners}" method="get" class="form-horizontal" id="search-owner-form">
    <div class="form-group">
      <div class="control-group" id="lastNameGroup">
        <label class="col-sm-2 control-label" t:text="#{lastName}">Last name </label>
        <div class="col-sm-10">
          <input class="form-control" t:field="*{lastName}" size="30" maxlength="80" />
          <span class="help-inline">
            <div t:if="fields.hasErrors('*')">
              <p t:each="err : fields.errors('*')" t:text="err">Error</p>
            </div>
          </span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary" t:text="#{findOwner}">Find Owner</button>
      </div>
    </div>

    <a class="btn btn-primary" t:href="@{/owners/new}" t:text="#{addOwner}">Add Owner</a>

  </form>

</body>

</html>
