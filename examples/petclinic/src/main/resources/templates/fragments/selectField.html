<!DOCTYPE html>

<html xmlns:t="https://tessera.dev" t:import="org.springframework.samples.petclinic.owner.PetType">

<body>
  <form>
    <t:block t:fragment="select (String label, Field name, Collection<PetType> items)">
      <div t:with="valid=!fields.hasErrors(name)" t:class="'form-group' + (valid ? '' : ' has-error')"
        class="form-group">
        <label t:for="name" class="col-sm-2 control-label" t:text="label">Label</label>

        <div class="col-sm-10">
          <select t:field="name">
            <option t:each="item : items" t:value="item" t:text="item">dog</option>
          </select>
          <span t:if="valid" class="fa fa-ok form-control-feedback" aria-hidden="true"></span>
          <t:block t:if="!valid">
            <span class="fa fa-remove form-control-feedback" aria-hidden="true"></span>
            <span class="help-inline" t:errors="name">Error</span>
          </t:block>
        </div>
      </div>
    </t:block>
  </form>
</body>

</html>
