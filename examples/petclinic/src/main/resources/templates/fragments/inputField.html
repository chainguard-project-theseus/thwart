<!DOCTYPE html>

<html xmlns:t="https://thwart.chainguard.dev">

<body>
  <form>
    <t:block t:fragment="input (String label, Field name, String type)" t:replace="~{:: inputWithMin (label, name, type, null)}"></t:block>
    <t:block t:fragment="inputWithMin (String label, Field name, String type, LocalDate min)">
      <div t:with="valid=!fields.hasErrors(name)" t:class="'form-group' + (valid ? '' : ' has-error')"
        class="form-group">
        <label t:for="name" class="col-sm-2 control-label" t:text="label">Label</label>
        <div class="col-sm-10">
          <div t:switch="type">
            <input t:case="'text'" class="form-control" type="text" t:field="name" />
            <input t:case="'date'" class="form-control" type="date" t:field="name" t:min="min" />
          </div>
          <span t:if="valid" class="fa fa-ok form-control-feedback" aria-hidden="true"></span>
          <t:block t:if="!valid">
            <span class="fa fa-remove form-control-feedback" aria-hidden="true"></span>
            <span class="help-inline" t:errors="name">Error</span>
          </t:block>
        </div>
      </div>
    </t:block>
  </form>
</body>

</html>
