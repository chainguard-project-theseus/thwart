<!DOCTYPE html>

<html t:fragment="layout(Fragment template, String menu)" xmlns:t="https://thwart.chainguard.dev">

<head>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" t:href="@{/resources/images/favicon.png}">
  <title t:text="#{layoutTitle}">PetClinic :: a Spring Framework demonstration</title>
  <link t:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" t:href="@{/resources/css/petclinic.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark" role="navigation">
    <div class="container-fluid">
      <a class="navbar-brand" t:href="@{/}"><span></span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar" style>

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" t:remove="all">

          <li t:fragment="menuItem(String link, boolean active, String title, String glyph, String text)" class="nav-item">
            <a t:class="active ? 'nav-link active' : 'nav-link'" t:href="link" t:title="title">
              <span t:class="'fa fa-'+glyph" class="fa fa-home"></span>
              <span t:text="text">Template</span>
            </a>
          </li>

        </ul>

        <ul class="nav navbar-nav me-auto">

          <li t:replace="~{::menuItem(@{/}, menu == 'home','home page','home',#{home})}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span t:text="#{home}">Home</span>
          </li>

          <li t:replace="~{::menuItem(@{/owners/find}, menu == 'owners','find owners','search',#{findOwners})}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span t:text="#{findOwners}">Find owners</span>
          </li>

          <li t:replace="~{::menuItem(@{/vets.html}, menu == 'vets','veterinarians','th-list',#{vets})}">
            <span class="fa fa-th-list" aria-hidden="true"></span>
            <span t:text="#{vets}">Veterinarians</span>
          </li>

          <li
            t:replace="~{::menuItem(@{/oups}, menu == 'error','trigger a RuntimeException to see how it is handled','exclamation-triangle',#{error})}">
            <span class="fa exclamation-triangle" aria-hidden="true"></span>
            <span t:text="#{error}">Error</span>
          </li>

        </ul>
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="container xd-container">

      <t:block t:insert="template" />

      <br />
      <br />
      <div class="container">
        <div class="row">
          <div class="col-12 text-center">
            <img src="../static/images/spring-logo.svg" t:src="@{/resources/images/spring-logo.svg}"
              alt="VMware Tanzu Logo" class="logo">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script t:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
