<!DOCTYPE html>
<html xmlns:t="https://tessera.dev" t:params="Object owner, Object swap, Object selector, Object callback">
<body>
  <!-- Computed names outside HTML are converted as they are: the compiler checks their values (#587). -->
  <button t:hx-get="@{/owners}" t:hx-target="'#owner-' + owner.id" t:hx-swap="swap">load</button>
  <div t:hx-select="selector" t:title="owner.lastName">attr</div>
  <div t:up-on-loaded="callback">unpoly</div>
  <div t:data-hx-target="selector" t:aria-label="owner.lastName">known names</div>
  <!-- A missing space between attributes is added. -->
  <a href="/owners" class="btn" t:text="owner.lastName">owner</a>
  <a href="/owners" class="btn">spaced</a>
  <!-- Values outside the script prelude are left as they are: the compiler reports them (#540). -->
  <script th:inline="javascript">
    var path = location.pathname.split(/\//);
    var owner = [[${owner.id}]];
  </script>
  <script>
    var owner = [[${owner.id}]];
    var path = location.pathname.split(/\//);
  </script>
  <script>
    var parts = [[${owner.birthDate}]].split(".");
    initOwner([[${owner.id}]], parts);
    var options = {name: [[${owner.lastName}]], editable: true};
    var greeting = "Hello [[${owner.firstName}]]!";
    numberValidationMessage = [[${owner.telephone}]];
    var visits = [[${owner.visits}]];
    var re = /^[[${owner.city}]]$/;
  </script>
</body>
</html>
