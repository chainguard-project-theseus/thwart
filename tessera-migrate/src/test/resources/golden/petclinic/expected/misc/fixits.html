<!DOCTYPE html>
<html xmlns:t="https://tessera.dev" t:params="Object owner, Object swap, Object selector, Object callback">
<body>
  <!-- Computed names the compiler does not know (#330): htmx's data- form is rewritten, others reported. -->
  <button t:hx-get="@{/owners}" t:data-hx-target="'#owner-' + owner.id" t:data-hx-swap="swap">load</button>
  <div t:attr="data-hx-select=selector,title=owner.lastName">attr</div>
  <div t:up-on-loaded="callback">unpoly</div>
  <div t:data-hx-target="selector" t:aria-label="owner.lastName">known names</div>
  <!-- A missing space between attributes is added. -->
  <a href="/owners" class="btn" t:text="owner.lastName">owner</a>
  <a href="/owners" class="btn">spaced</a>
  <!-- Code before the last inline that the data-prelude rule rejects is reported. -->
  <script th:inline="javascript">
    var path = location.pathname.split(/\//);
    var owner = [[${owner.id}]];
  </script>
  <script>
    var owner = [[${owner.id}]];
    var path = location.pathname.split(/\//);
  </script>
</body>
</html>
