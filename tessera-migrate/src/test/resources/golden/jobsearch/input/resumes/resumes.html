<t:block xmlns:t="https://tessera.dev" t:import="kg.attractor.jobsearch.dto.*"       t:params="List<ResumeDto> resumes, UserDto authorizedUser">
<!-- printed before the layout, as the old page did (the browser then ignores the layout's doctype) -->
<link rel="stylesheet" href="/static/css/resume.css">
<t:block t:replace="~{fragments/layout :: layout(null, ~{::body})}">
<body t:remove="tag">
    <header><t:block t:replace="~{fragments/navbar :: navbar(authorizedUser)}"></t:block></header>
    <div class="resume-container">
        <h1 class="page-title">[[#{resumes.list.title}]]</h1>
        <p t:each="resume : resumes" t:text="resume.title">Resume</p>
    </div>
</body>
</t:block>
</t:block>
