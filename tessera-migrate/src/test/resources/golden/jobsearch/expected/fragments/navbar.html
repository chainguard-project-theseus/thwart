<div xmlns:t="https://tessera.dev" t:import="kg.attractor.jobsearch.dto.UserDto">
<!-- What the old FreeMarker navbar include produced: a <style> followed by a whole document. -->
<t:block t:fragment="navbar(UserDto authorizedUser)">
<style>
    .d-flex {
        position: relative;
    }
</style>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <a class="navbar-brand" href="/">[[#{layout.navbar.job_search}]]</a>
        <span t:if="authorizedUser != null" t:text="authorizedUser.name">Name</span>
    </nav>
    <script src="/static/scripts/vacancy/vacancies-filter.js"></script>
</t:block>
</div>
