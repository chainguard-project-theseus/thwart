<!DOCTYPE html>

<html xmlns:t="https://tessera.dev" t:import="org.springframework.samples.petclinic.owner.Owner"
  t:params="List<Owner> listOwners"
  t:replace="~{fragments/layout :: layout(~{::body}, 'owners')}">

  <body t:remove="tag">

    <h2>Owners</h2>

    <table id="owners" class="table table-striped">
      <tr t:each="owner : listOwners">
        <td t:text="owner.lastName">Name</td>
      </tr>
    </table>

  </body>

</html>
