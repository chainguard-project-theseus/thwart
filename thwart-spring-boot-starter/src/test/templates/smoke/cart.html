<!DOCTYPE html>
<html xmlns:t="https://thwart.chainguard.dev" t:import="dev.chainguard.thwart.spring.e2e.Cart" t:params="Cart cart">
  <body>
    <form t:object="cart" t:action="@{/cart}" method="post">
      <div t:each="line : cart.lines" t:classappend="fields.hasErrors(*{lines[lineStat.index].name}) ? 'has-error'">
        <input type="text" t:field="*{lines[lineStat.index].name}" />
        <input type="text" t:field="*{lines[lineStat.index].due}" />
        <span class="error" t:errors="*{lines[lineStat.index].name}">error</span>
        <span class="error" t:errors="*{lines[lineStat.index].due}">error</span>
        <b class="due" t:text="fields.value(*{lines[lineStat.index].due})">due</b>
        <i class="due-error" t:if="fields.hasErrors(*{lines[lineStat.index].due})"
           t:text="fields.errors(*{lines[lineStat.index].due}).first">error</i>
      </div>
      <input type="text" class="literal" t:field="*{qty['tea']}" />
      <span class="literal-error" t:errors="*{qty['tea']}">error</span>
      <div t:each="e : cart.qty">
        <input type="text" t:field="*{qty[e.key]}" />
        <span class="error" t:errors="*{qty[e.key]}">error</span>
      </div>
    </form>
  </body>
</html>
