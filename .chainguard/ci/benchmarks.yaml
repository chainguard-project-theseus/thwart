version: 1
environment:
  packages: [openjdk-21-default-jdk, openjdk-8, maven-3.9, git, bash]
  # Mounts ~/.m2/repository and Gradle's artifact store from the pools identities.yaml defines (#698).
  caches:
    java: {}
  vars:
    JAVA_HOME: /usr/lib/jvm/default-jvm
    JDK8_HOME: /usr/lib/jvm/java-1.8-openjdk
    LANG: C.UTF-8
    CI: "true"
    MAVEN_OPTS: -Djava.io.tmpdir=/var/tmp
checks:
  smoke:
    description: Builds and smoke-runs every JMH benchmark and parameter combination.
    trigger: presubmit
    resources: medium-amd64
    timeout: 15m
    network:
      egress: [repo.maven.apache.org, repo1.maven.org]
    # maven/verify* run the other tests; smoke and measure run only the benchmark module's (#697).
    vars: {MAVEN_ARGS: "-Dtest=dev/chainguard/thwart/benchmarks/** -Dsurefire.failIfNoSpecifiedTests=false -DskipITs"}
    cmd: [bash, thwart-benchmarks/ci.sh, smoke]
  measure:
    description: Measures JMH throughput and allocation after each merge; timings are informational.
    trigger: postsubmit
    resources: medium-amd64
    timeout: 30m
    network:
      egress: [repo.maven.apache.org, repo1.maven.org]
    vars: {MAVEN_ARGS: "-Dtest=dev/chainguard/thwart/benchmarks/** -Dsurefire.failIfNoSpecifiedTests=false -DskipITs"}
    cmd: [bash, thwart-benchmarks/ci.sh, measure]
