version: 1
environment:
  packages: [openjdk-25-default-jdk, maven-3.10, gradle-9, bash]
  # Mounts ~/.m2/repository and Gradle's artifact store from the pools identities.yaml defines (#698).
  caches:
    java: {}
  vars:
    JAVA_HOME: /usr/lib/jvm/default-jvm
    LANG: C.UTF-8
    CI: "true"
    MAVEN_OPTS: -Djava.io.tmpdir=/var/tmp
checks:
  example:
    description: Builds and tests the Spring Boot app in examples/gradle with Gradle against the installed artifacts (#427, #794).
    trigger: [presubmit, postsubmit]
    resources: medium
    timeout: 15m
    network:
      # The Spring Boot Gradle plugins resolve from Maven Central (examples/gradle/settings.gradle).
      egress: [repo.maven.apache.org, repo1.maven.org]
    cmd: [bash, -c, "mvn -B -ntp install -DskipTests -pl thwart-compiler,thwart-spring-boot-starter -am && sh examples/gradle/verify.sh"]
