version: 1
environment:
  packages: [openjdk-25-default-jdk, openjdk-8, maven-3.10, git, bash]
  # Mounts ~/.m2/repository and Gradle's artifact store from the pools identities.yaml defines (#698).
  caches:
    java: {}
  vars:
    JAVA_HOME: /usr/lib/jvm/default-jvm
    # Jdk8ProcessorTest runs the annotation processor on this javac (#166).
    JDK8_HOME: /usr/lib/jvm/java-1.8-openjdk
    LANG: C.UTF-8
    CI: "true"
    MAVEN_OPTS: -Djava.io.tmpdir=/var/tmp
# mvn -B verify in three shards that together run each test once (#697). Maven 3.9 prepends
# MAVEN_ARGS to the command line. Separate checks, not one foreach: Checks refuses a change that
# turns an existing check into foreach instances as narrowing its own selection.
checks:
  verify:
    description: Runtime and compiler tests at Java 21, and the compiler's ShadedJarIT.
    trigger: [presubmit, postsubmit]
    # The slowest shard: its tests in two surefire forks on a large runner (#699).
    resources: large
    timeout: 20m
    network:
      egress: [repo.maven.apache.org, repo1.maven.org]
    vars: {MAVEN_ARGS: "-pl thwart-compiler -am -Dthwart.skipRelease8=true -DforkCount=2 -DreuseForks=true"}
    cmd: [mvn, -B, -ntp, verify]
  verify-release8:
    description: The compiler's template tests again with generated code compiled at javac release 8.
    trigger: [presubmit, postsubmit]
    resources: medium
    timeout: 20m
    network:
      egress: [repo.maven.apache.org, repo1.maven.org]
    vars: {MAVEN_ARGS: "-pl thwart-compiler -am -Dthwart.skipDefaultTests=true -DskipITs"}
    cmd: [mvn, -B, -ntp, verify]
  verify-rest:
    description: Unit and integration tests of every module but the runtime, compiler and benchmarks (smoke).
    trigger: [presubmit, postsubmit]
    resources: medium
    timeout: 20m
    network:
      egress: [repo.maven.apache.org, repo1.maven.org]
    vars: {MAVEN_ARGS: "-Dthwart.skipRelease8=true -Dtest=!dev/chainguard/thwart/compiler/**,!dev/chainguard/thwart/runtime/**,!dev/chainguard/thwart/benchmarks/** -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=!dev/chainguard/thwart/compiler/** -Dit.failIfNoSpecifiedTests=false"}
    cmd: [mvn, -B, -ntp, verify]
