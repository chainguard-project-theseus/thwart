# Ownership for the Checks review gate. One approval from dlorenc or from the
# thwart Checks reviewer (bot:thwart, .chainguard/reviewers.yaml) passes the
# gate for every path; the protected paths (reviewers files, prompt files,
# AGENTS.md, CLAUDE.md and this file) still need a person.
version: 1
entries:
  - pattern: "*"
    owners: [dlorenc, 'bot:thwart']
    gate: 1
