<!DOCTYPE html>
<html xmlns:t="https://thwart.chainguard.dev" t:import="dev.chainguard.thwart.benchmarks.*" t:params="List<Owner> owners, int page">
<head>
<title>Owners</title>
</head>
<body>
<h2>Owners</h2>
<table id="owners" class="table table-striped">
<thead>
<tr><th>Name</th><th>Address</th><th>City</th><th>Telephone</th><th>Pets</th><th>Status</th></tr>
</thead>
<tbody><tr t:each="owner, stat : ${owners}" t:class="${stat.odd} ? 'odd' : 'even'">
<td><a t:href="@{/owners/{ownerId}(ownerId=${owner.id})}" t:text="${owner.firstName + ' ' + owner.lastName}">Name</a></td>
<td t:text="${owner.address}">Address</td>
<td t:text="${owner.city}">City</td>
<td t:text="${owner.telephone}">Telephone</td>
<td><span t:each="pet, ps : ${owner.pets}"><a t:href="@{/owners/{ownerId}/pets/{petName}(ownerId=${owner.id}, petName=${pet.name})}" t:title="${pet.type}" t:text="${pet.name}">Pet</a><span t:unless="${ps.last}">, </span></span><em t:if="${owner.pets.isEmpty()}">none</em></td>
<td><span t:if="${owner.active}" class="badge active">active</span><span t:unless="${owner.active}" class="badge">inactive</span></td>
</tr>
</tbody>
</table>
<a t:href="@{/owners(page=${page + 1}, size=100)}">Next page</a>
</body>
</html>
