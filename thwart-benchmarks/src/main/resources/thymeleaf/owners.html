<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Owners</title>
</head>
<body>
<h2>Owners</h2>
<table id="owners" class="table table-striped">
<thead>
<tr><th>Name</th><th>Address</th><th>City</th><th>Telephone</th><th>Pets</th><th>Status</th></tr>
</thead>
<tbody><tr th:each="owner, stat : ${owners}" th:class="${stat.odd} ? 'odd' : 'even'">
<td><a th:href="@{/owners/{ownerId}(ownerId=${owner.id})}" th:text="${owner.firstName + ' ' + owner.lastName}">Name</a></td>
<td th:text="${owner.address}">Address</td>
<td th:text="${owner.city}">City</td>
<td th:text="${owner.telephone}">Telephone</td>
<td><span th:each="pet, ps : ${owner.pets}"><a th:href="@{/owners/{ownerId}/pets/{petName}(ownerId=${owner.id}, petName=${pet.name})}" th:title="${pet.type}" th:text="${pet.name}">Pet</a><span th:unless="${ps.last}">, </span></span><em th:if="${owner.pets.isEmpty()}">none</em></td>
<td><span th:if="${owner.active}" class="badge active">active</span><span th:unless="${owner.active}" class="badge">inactive</span></td>
</tr>
</tbody>
</table>
<a th:href="@{/owners(page=${page + 1}, size=100)}">Next page</a>
</body>
</html>
