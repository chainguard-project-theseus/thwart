<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Computed names outside HTML are converted as they are: the compiler checks their values (#587). -->
  <button th:hx-get="@{/owners}" th:hx-target="${'#owner-' + owner.id}" th:hx-swap="${swap}">load</button>
  <div th:hx-select="${selector}" th:title="${owner.lastName}">attr</div>
  <div th:up-on-loaded="${callback}">unpoly</div>
  <div th:data-hx-target="${selector}" th:aria-label="${owner.lastName}">known names</div>
  <!-- A missing space between attributes is added. -->
  <a href="/owners"class="btn" th:text="${owner.lastName}">owner</a>
  <a href="/owners" class="btn">spaced</a>
  <!-- Values outside the script prelude are left as they are: the compiler reports them (#540). -->
  <script th:inline="javascript">
    var path = location.pathname.split(/\//);
    var owner = /*[[${owner.id}]]*/ 0;
  </script>
  <script>
    var owner = [[${owner.id}]];
    var path = location.pathname.split(/\//);
  </script>
  <script>
    var parts = [[${owner.birthDate}]].split(".");
    initOwner([[${owner.id}]], parts);
    var options = {name: [[${owner.lastName}]], editable: true};
    var greeting = "Hello [[${owner.firstName}]]!";
    numberValidationMessage = [[${owner.telephone}]];
    var visits = [[${owner.visits}]];
    var re = /^[[${owner.city}]]$/;
  </script>
</body>
</html>
