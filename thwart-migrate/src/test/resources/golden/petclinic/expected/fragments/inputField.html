<html xmlns:t="https://thwart.chainguard.dev">
<body>
  <t:block t:fragment="input(Object label, Object name, Object type)">
    <div t:with="valid=!fields.hasErrors(name)"
      t:class="'form-group' + (valid ? '' : ' has-error')"
      class="form-group">
      <label class="col-sm-2 control-label" t:text="label">Label</label>
      <div class="col-sm-10">
        <div t:switch="type">
          <input t:case="'text'" class="form-control" type="text" t:field="*{__${name}__}" />
          <input t:case="'date'" class="form-control" type="date" t:field="*{__${name}__}" />
        </div>
        <span t:if="valid" class="fa fa-ok form-control-feedback" aria-hidden="true"></span>
        <t:block t:if="!valid">
          <span class="fa fa-remove form-control-feedback" aria-hidden="true"></span>
          <span class="help-inline" t:errors="*{__${name}__}">Error</span>
        </t:block>
      </div>
    </div>
  </t:block>
</body>
</html>
