<!DOCTYPE html>

<html xmlns:t="https://thwart.chainguard.dev"
  t:replace="~{fragments/layout :: layout(~{::body},'owners')}" t:params="Object listOwners, Object totalPages, Object currentPage">

<body t:remove="tag">

  <h2>Owners</h2>

  <table id="owners" class="table table-striped">
    <thead>
      <tr>
        <th style="width: 150px;">Name</th>
        <th style="width: 200px;">Address</th>
        <th>City</th>
        <th style="width: 120px">Telephone</th>
        <th>Pets</th>
      </tr>
    </thead>
    <tbody>
      <tr t:each="owner : listOwners">
        <td>
          <a t:href="@{/owners/__${owner.id}__}" t:text="owner.firstName + ' ' + owner.lastName"></a>
        </td>
        <td t:text="owner.address" />
        <td t:text="owner.city" />
        <td t:text="owner.telephone" />
        <td><span t:text="strings.join(owner.pets, ', ')" /></td>
      </tr>
    </tbody>
  </table>
  <div t:if="totalPages > 1">
    <span>Pages:</span>
    <span>[</span>
    <span t:each="i: numbers.sequence(1, totalPages)">
      <a t:if="currentPage != i" t:href="@{/owners(page=i)}">[[${i}]]</a>
      <span t:unless="currentPage != i">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a t:if="currentPage > 1" t:href="@{/owners(page=1)}" title="First" class="fa fa-fast-backward"></a>
      <span t:unless="currentPage > 1" title="First" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a t:if="currentPage < totalPages" t:href="@{/owners(page=totalPages)}" title="Last"
        class="fa fa-fast-forward"></a>
      <span t:unless="currentPage < totalPages" title="Last" class="fa fa-step-forward"></span>
    </span>
  </div>
</body>
</html>
