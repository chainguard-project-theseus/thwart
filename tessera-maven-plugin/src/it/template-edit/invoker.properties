# 1. First build. Another plugin writes git.properties into target/classes before compile (#626):
# it must outlive this build and the deletions in 2, 4, 6 and 7.
invoker.goals.1 = clean resources:copy-resources@stamp compile
# 2. Only a template changes, to one the compiler rejects: the build must fail, not stay green.
invoker.goals.2 = resources:copy-resources@unsafe compile
invoker.buildResult.2 = failure
# 3. Fixed.
invoker.goals.3 = resources:copy-resources@v2 compile
# 4. Only a template changes after a good build: verify.groovy checks the class was regenerated.
invoker.goals.4 = resources:copy-resources@v3 compile
# 5. Nothing changes: the output is kept.
invoker.goals.5 = compile
# 6. Only the base message file changes (#447): the module is compiled again.
invoker.goals.6 = resources:copy-resources@msg-v2 compile
# 7. Only a locale file changes, to a link the message (inside a link) may not hold: the build must fail.
invoker.goals.7 = resources:copy-resources@msg-unsafe compile
invoker.buildResult.7 = failure
# 8. Fixed.
invoker.goals.8 = resources:copy-resources@msg-fixed compile
# 9. Nothing changes: the output is kept.
invoker.goals.9 = process-classes
